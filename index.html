function unitPrice(line){return line.unitPrice+line.mods.reduce((sum,mod)=>sum+mod.price,0);}
function partAmount(part,order){return order.lines.reduce((sum,line)=>sum+(part.assigned[line.id]||0)*unitPrice(line),0);}
function remainingUnits(line){return line.qty-paymentParts.reduce((sum,part)=>sum+(part.assigned[line.id]||0),0);}
function cashFeedback(amount,receivedText){
  const received=cashAmount(receivedText);
  if(received===null)return {message:receivedText.trim()?"Ingresá un importe válido en pesos enteros.":"Ingresá cuánto dinero te entregaron.",valid:false,short:false};
  if(received<amount)return {message:`Faltan ${money(amount-received)} para cubrir este pago.`,valid:false,short:true};
  return {message:`CAMBIO A ENTREGAR: ${money(received-amount)}`,valid:true,short:false};
}
function brlFeedback(chargedText,receivedText){
  const charged=realMinor(chargedText),received=realMinor(receivedText);
  if(charged===null||charged<1)return {message:"Ingresá el importe acordado en reales.",valid:false,short:false};
  if(received===null)return {message:"Ingresá cuánto dinero te entregaron en reales.",valid:false,short:false};
  if(received<charged)return {message:`Faltan ${realMoneyMinor(charged-received)}.`,valid:false,short:true};
  return {message:`CAMBIO A ENTREGAR: ${realMoneyMinor(received-charged)}`,valid:true,short:false};
}
function paymentAllocationStatus(order){
  if(!paymentParts.length||paymentParts.some(part=>Object.entries(part.assigned).some(([id,qty])=>!Number.isSafeInteger(qty)||qty<1||!order.lines.some(line=>line.id===id))))return {valid:false,message:"La comanda cambió. Volvé a abrir el cobro y revisá los productos."};
  if(order.lines.some(line=>remainingUnits(line)<0))return {valid:false,message:"Hay más unidades asignadas que las cargadas en la comanda."};
  const remaining=order.lines.reduce((sum,line)=>sum+remainingUnits(line),0);
  if(remaining>0)return {valid:false,message:`Quedan ${remaining} ${remaining===1?"unidad sin asignar":"unidades sin asignar"}.`};
  const empty=paymentParts.findIndex(part=>partAmount(part,order)<=0);

function payerName(index){return paymentParts[index]?.name.trim()||`Persona ${index+1}`;}
function paymentPartStatus(part,order){

  if(part.method==="Efectivo"&&!cashFeedback(partAmount(part,order),part.cashReceived).valid)return {valid:false,message:"Revisar efectivo"};
  if(part.method==="Efectivo BRL"&&!brlFeedback(part.brlCharged,part.brlReceived).valid)return {valid:false,message:"Revisar reales"};
  return {valid:true,message:"Listo para confirmar"};
}
function paymentStatus(order){
  const allocation=paymentAllocationStatus(order);if(!allocation.valid)return allocation;
  for(let i=0;i<paymentParts.length;i++){const status=paymentPartStatus(paymentParts[i],order);if(!status.valid)return {valid:false,message:`${payerName(i)}: ${status.message.toLowerCase()}.`};}
  return {valid:true,message:`Cobro completo · ${money(orderTotal(order))}`};
}
function rememberPaymentAllocation(){paymentUndo.push({parts:deepCopy(paymentParts),selected:selectedPaymentPart,step:paymentStep});if(paymentUndo.length>50)paymentUndo.shift();}

function undoPaymentAllocation(){
  const previous=paymentUndo.pop();if(!previous)return;
  paymentParts=previous.parts.map(part=>{const currentPart=paymentParts.find(item=>item.id===part.id);if(!currentPart)return part;const result={...currentPart,assigned:part.assigned};if(JSON.stringify(currentPart.assigned)!==JSON.stringify(part.assigned))clearPaymentAmounts(result);return result;});
  selectedPaymentPart=previous.selected;paymentStep=previous.step;renderModal();
}
function assignPaymentUnit(lineId,index,delta){
  const line=current()?.lines.find(item=>item.id===lineId),part=paymentParts[index];
  if(!line||!part||![1,-1].includes(delta))return;
  const count=part.assigned[lineId]||0;

  if(delta<0&&count<=0)return;
  rememberPaymentAllocation();
  const next=count+delta;if(next)part.assigned[lineId]=next;else delete part.assigned[lineId];
  clearPaymentAmounts(part);
  renderModal();
}
function assignPaymentRest(lineId,index){
  const line=current()?.lines.find(item=>item.id===lineId),part=paymentParts[index];
  if(!line||!part)return;
  const remaining=remainingUnits(line);if(remaining<=0)return;

}
function assignAllRemaining(index){
  const part=paymentParts[index],order=current();if(!part||!order)return;
  if(!order.lines.some(line=>remainingUnits(line)>0))return;
  rememberPaymentAllocation();let changed=false;

}
function selectPaymentMethod(index,method){const part=paymentParts[index];if(!part||(method!==""&&!paymentMethods.includes(method))||part.method===method)return;part.method=method;clearPaymentAmounts(part);renderModal();}
function setPaymentStep(step){if(!["assign","pay"].includes(step))return;if(step==="pay"&&!paymentAllocationStatus(current()).valid){toast(paymentAllocationStatus(current()).message,true);return;}paymentStep=step;renderModal();const body=$(".payment-body");if(body)body.scrollTop=0;}

    if(cashResult){const feedback=part.method==="Efectivo BRL"?brlFeedback(part.brlCharged,part.brlReceived):cashFeedback(amount,part.cashReceived);cashResult.textContent=feedback.message;cashResult.classList.toggle("short",feedback.short);cashResult.classList.toggle("valid",feedback.valid);}

function confirmClose(){
  const order=current();if(!order||!order.lines.length||!canEdit())return;

  const total=orderTotal(order),payments=paymentParts.map(part=>{

    const entry={payer:part.name.trim(),method:part.method,amount,items};
    if(part.method==="Efectivo"){entry.cashReceived=cashAmount(part.cashReceived);entry.cashChange=entry.cashReceived-amount;}

  if(!commitData(next))return;undoStacks.delete(order.number);selectedSlot=null;modal=null;paymentParts=[];go("home");toast(`${numberLabel(order.number)} cobrado · ${money(total)} · Lugar libre`);
}

function kitchenItem(line,tag="",cancelled=false){return `<div class="k-line ${cancelled?"cancelled-line":""}">${tag?`<span class="k-label ${tag==="CANCELADO"?"cancel":tag==="NUEVO"?"new":""}">${tag}</span>`:""}<div class="k-product">${line.qty} × ${safe(line.name)}</div>${line.mods.length||line.note?`<div class="k-mods">${lineDetails(line,false)}</div>`:""}</div>`;}
function kitchenLines(order){
  const baseline=order.preparedSnapshot.length?order.preparedSnapshot:order.sentSnapshot;
  const net=lineChanges(baseline,order.lines),latest=new Map(net.filter(event=>event.after).map(event=>[event.after.id,event]));
  let html=order.lines.map(line=>{const event=latest.get(line.id),prepared=order.preparedSnapshot.find(old=>old.id===line.id&&sameLine(old,line));return kitchenItem(line,event?.kind||(prepared?"YA PREPARADO":""));}).join("");
  if(!order.lines.length)html='<p class="order-hint">No quedan productos por preparar.</p>';
  const events=order.kitchenEvents.slice(order.kitchenAck);
  const cancellations=new Map(net.filter(event=>event.kind==="CANCELADO").map(event=>[event.before.id,event]));
  for(const event of events)if(event.kind==="CANCELADO"&&!order.lines.some(line=>line.id===event.before.id))cancellations.set(event.before.id,event);
  const cancelled=[...cancellations.values()];
  if(cancelled.length)html+=`<div class="k-cancelled"><strong>Cancelado:</strong> ${cancelled.map(event=>`${event.before.qty} × ${safe(event.before.name)}`).join(" · ")}</div>`;
  if(events.length)html+=`<details class="k-change-log"><summary>Ver historial de ${events.length} ${events.length===1?"edición":"ediciones"}</summary><section class="k-changes"><p class="note">Son correcciones de esta comanda, no productos adicionales.</p>${events.map(event=>`<div class="k-change"><span class="k-label ${event.kind==="CANCELADO"?"cancel":event.kind==="NUEVO"?"new":""}">${event.kind}</span> <time>${fmtTime(event.at)}</time>${event.before?`<div class="${event.kind==="CANCELADO"?"cancelled-line":"k-old"}">${event.kind==="MODIFICADO"?"Antes: ":""}${event.before.qty} × ${safe(event.before.name)}${lineDetails(event.before,false)?`<div class="k-mods">${lineDetails(event.before,false)}</div>`:""}</div>`:""}${event.after?`<div>${event.kind==="MODIFICADO"?"Ahora: ":""}${event.after.qty} × ${safe(event.after.name)}${lineDetails(event.after,false)?`<div class="k-mods">${lineDetails(event.after,false)}</div>`:""}</div>`:""}</div>`).join("")}</section></details>`;
  return html;
}

const staffPaymentMethods=["Efectivo","Efectivo BRL","PREX","Pix","Tarjeta","Transferencia","Otros"];
function staffForDate(){return data.history.filter(order=>order.saleType==="staff"&&dayKey(order.closedAt)===staffDate).sort((a,b)=>b.closedAt-a.closedAt);}
function staffFeedback(){
  const amount=cashAmount(staffDraft.amount);if(!amount)return "";
  if(staffDraft.method==="Pix")return `${brlMoney(amount)} por Pix · 1 real = $8,30`;
  if(staffDraft.method==="Efectivo"){
    const received=staffDraft.cashReceived.trim()?cashAmount(staffDraft.cashReceived):amount;
    if(received===null)return "Ingresá el efectivo recibido en pesos enteros.";
    return received<amount?`Faltan ${money(amount-received)} para completar el cobro.`:`Cambio: ${money(received-amount)}`;
  }
  if(staffDraft.method==="Efectivo BRL"){
    if(!staffDraft.brlCharged.trim())return "Ingresá el importe acordado en reales.";
    const charged=realMinor(staffDraft.brlCharged),received=staffDraft.brlReceived.trim()?realMinor(staffDraft.brlReceived):charged;
    if(charged===null||received===null||charged<1)return "Revisá los importes en reales.";
    return received<charged?`Faltan ${realMoneyMinor(charged-received)} para completar el cobro.`:`Cambio: ${realMoneyMinor(received-charged)}`;
  }
  return "";
}

function registerStaffSale(){
  if(!canEdit())return false;
  const reject=message=>{staffError=message;render();return false;};
  const amount=cashAmount(staffDraft.amount),detail=staffDraft.detail.trim(),name=staffDraft.name.trim(),method=staffDraft.method;
  if(amount===null||amount<1)return reject("Ingresá un valor al coste mayor que cero, en pesos enteros.");
  if(!detail||detail.length>500)return reject("Escribí el detalle de la venta (hasta 500 caracteres).");
  if(name.length>50)return reject("El nombre admite hasta 50 caracteres.");
  if(!staffPaymentMethods.includes(method))return reject("Elegí un medio de pago válido.");
  const at=now(),lineId=uid(),part={payer:name,method,amount,items:[{lineId,qty:1}]};
  let single={};
  if(method==="Efectivo"){
    const received=staffDraft.cashReceived.trim()?cashAmount(staffDraft.cashReceived):amount;
    if(received===null||received<amount)return reject("El efectivo recibido debe cubrir el valor de la venta.");
    single={cashReceived:received,cashChange:received-amount};Object.assign(part,single);
  }
  if(method==="Efectivo BRL"){
    const charged=realMinor(staffDraft.brlCharged),received=staffDraft.brlReceived.trim()?realMinor(staffDraft.brlReceived):charged;
    if(charged===null||charged<1||received===null||received<charged)return reject("Indicá el importe a cobrar en reales y revisá el efectivo recibido.");
    single={brlChargedMinor:charged,brlReceivedMinor:received,brlChangeMinor:received-charged};Object.assign(part,single);
  }
  if(method==="Pix"){part.pixRate=PIX_RATE;part.pixBrl=brlAmount(amount);}
  const next=deepCopy(data),number=next.nextNumber++;
  next.history.push({number,slot:"p0",label:"Personal · Al coste",saleType:"staff",name,status:"CERRADO",openedAt:at,sentAt:null,readyAt:null,closedAt:at,payment:method,payments:[part],...single,total:amount,lines:[{id:lineId,productId:"staff-manual",name:"Venta al personal",unitPrice:amount,qty:1,mods:[],note:detail,permiteCombo:false}],sentSnapshot:[],kitchenEvents:[],kitchenAck:0,preparedSnapshot:[],pendingSinceAt:null,movedFrom:null});
  if(!commitData(next))return false;
  staffDraft=emptyStaffDraft();staffError="";staffDate=dayKey(at);render();toast(`Venta al personal registrada · ${money(amount)}`);return true;
}

}

function paymentSortedLines(lines){

    const aRank=priority.indexOf(a.category),bRank=priority.indexOf(b.category);

  });
}

function csvValue(value){let text=String(value??"");if(/^[=+@\-\t\r]/.test(text))text="'"+text;return `"${text.replace(/"/g,'""')}"`;}
async function download(text,filename,type){

  if(window.matchMedia?.("(pointer: coarse)")?.matches&&typeof File!=="undefined"&&typeof navigator!=="undefined"&&navigator.canShare&&navigator.share){
    const file=new File([blob],filename,{type});
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return true;}}
    catch(error){if(error?.name==="AbortError")return false;}
  }
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);return true;
}
function buildDayCsv(){const headers=["Número de pedido","Fecha","Hora apertura","Hora cocina","Hora listo","Hora cierre","Mesa/Pedido","Nombre","Productos","Total","Forma de pago","Entregado en efectivo","Cambio calculado","Detalle de pagos"],rows=historyForDate().map(o=>[numberLabel(o.number),fmtDate(o.closedAt),fmtTime(o.openedAt),fmtTime(o.sentAt),fmtTime(o.readyAt),fmtTime(o.closedAt),o.label||slotLabel(o.slot),o.name,o.lines.map(line=>`${line.qty} x ${line.name}${line.mods.length?" ["+line.mods.map(m=>m.name+(m.description?" · "+m.description:"")).join("; ")+"]":""}${line.note?" ("+line.note+")":""}`).join(" | "),o.total,o.payment,o.cashReceived??"",o.cashChange??"",paymentExport(o)]);return "\ufeff"+[headers,...rows].map(row=>row.map(csvValue).join(",")).join("\r\n");}

    case "view":go(element.dataset.view);break;
    case "staff-today":staffDate=dayKey(now());render();break;
    case "staff-export":void download(buildStaffCsv(),`kebba-personal-${staffDate}.csv`,"text/csv;charset=utf-8");break;
    case "home-group":if(["m","p"].includes(element.dataset.group)){homeGroup=element.dataset.group;render();$(".home-slots").scrollTop=0;$(".home-groups button.active")?.focus({preventScroll:true});}break;
    case "kitchen-group":if(["drafts","pending","ready","notices"].includes(element.dataset.group)){kitchenGroup=element.dataset.group;render();$(".kitchen-panel").scrollTop=0;$(".k-overview button.active")?.focus({preventScroll:true});}break;
    case "order-pane":if(["menu","ticket"].includes(element.dataset.pane)){mobileOrderPane=element.dataset.pane;render();window.scrollTo?.(0,0);}break;
    case "menu-section":if(["Comida","Bebidas y tragos"].includes(element.dataset.section)){selectedMenuSection=element.dataset.section;selectedMenuCategory=element.dataset.section==="Comida"?"Shawarmas":"Tragos";render();$(".menu-category").scrollTop=0;$(".menu-sections button.active")?.focus({preventScroll:true});}break;
    case "menu-category":if(data.catalog.some(product=>product.categoria===element.dataset.category)){selectedMenuCategory=element.dataset.category;render();$(".menu-category").scrollTop=0;const active=$(".menu-tabs button.active");active?.focus({preventScroll:true});active?.scrollIntoView?.({block:"nearest",inline:"nearest"});}break;
    case "open":openSlot(element.dataset.slot);break;
    case "add-product":addProduct(element.dataset.product);break;
    case "qty":changeQty(element.dataset.line,Number(element.dataset.delta));break;
    case "edit-line":selectedLine=selectedLine===element.dataset.line?null:element.dataset.line;render();if(selectedLine)$(".edit-box")?.scrollIntoView?.({block:"nearest"});break;
    case "done-edit":selectedLine=null;render();break;
    case "remove-line":removeLine(element.dataset.line);break;
    case "split-line":splitLine(element.dataset.line);break;
    case "toggle-mod":toggleMod(element.dataset.line,element.dataset.mod);break;
    case "send":sendKitchen();break;
    case "ready":markReady(element.dataset.slot);break;
    case "undo":undo();break;
    case "delete-order":deleteOrder();break;
    case "close-start":startClose();break;
    case "close-confirm":confirmClose();break;
    case "payment-split":{
      rememberPaymentAllocation();
      if(paymentParts.length===1)paymentParts=[newPaymentPart(),newPaymentPart()];
      else paymentParts=[newPaymentPart(Object.fromEntries(current().lines.map(line=>[line.id,line.qty])))];
      selectedPaymentPart=0;showAssignedPaymentLines=true;paymentStep="assign";
      renderModal();break;
    }
    case "payment-add":if(paymentParts.length<8){rememberPaymentAllocation();paymentParts.push(newPaymentPart());selectedPaymentPart=paymentParts.length-1;paymentStep="assign";renderModal();}break;
    case "payment-remove":if(paymentParts.length>1){const removed=Number(element.dataset.part);if(!Number.isInteger(removed)||removed<0||removed>=paymentParts.length)break;rememberPaymentAllocation();paymentParts.splice(removed,1);if(selectedPaymentPart>removed)selectedPaymentPart--;selectedPaymentPart=Math.min(selectedPaymentPart,paymentParts.length-1);if(paymentParts.length===1){paymentParts[0].assigned=Object.fromEntries(current().lines.map(line=>[line.id,line.qty]));clearPaymentAmounts(paymentParts[0]);}paymentStep="assign";renderModal();}break;
    case "payment-select":if(paymentParts[Number(element.dataset.part)]){selectedPaymentPart=Number(element.dataset.part);renderModal();if(paymentStep==="pay")$(".payment-body").scrollTop=0;}break;
    case "payment-step":setPaymentStep(element.dataset.step);break;
    case "payment-undo":undoPaymentAllocation();break;
    case "payment-method":selectPaymentMethod(Number(element.dataset.part),element.dataset.method);break;
    case "payment-exact":{const part=paymentParts[Number(element.dataset.part)];if(part?.method==="Efectivo"){part.cashReceived=String(partAmount(part,current()));renderModal();}break;}
    case "payment-next":{const index=paymentParts.map((part,index)=>index).find(index=>index>selectedPaymentPart&&!paymentPartStatus(paymentParts[index],current()).valid)??paymentParts.findIndex(part=>!paymentPartStatus(part,current()).valid);if(index>=0){selectedPaymentPart=index;renderModal();const body=$(".payment-body");if(body)body.scrollTop=0;}break;}
    case "payment-show-assigned":showAssignedPaymentLines=!showAssignedPaymentLines;renderModal();break;
    case "payment-all-remaining":assignAllRemaining(Number(element.dataset.part));break;
    case "payment-unit":assignPaymentUnit(element.dataset.line,Number(element.dataset.part),Number(element.dataset.delta));break;
    case "payment-rest":assignPaymentRest(element.dataset.line,Number(element.dataset.part));break;
    case "move-start":openModal("move");break;
    case "move-confirm":moveOrder(element.dataset.destination);break;
    case "modal-close":closeModal();break;
    case "history-detail":historyDetail=Number(element.dataset.number);render();$(".history-detail")?.focus();$(".history-detail")?.scrollIntoView?.({block:"nearest"});break;
    case "hide-history":historyDetail=null;render();break;
    case "history-today":historyDate=dayKey(now());historyDetail=null;render();break;
    case "ack-notice":{const next=deepCopy(data);next.kitchenNotices=next.kitchenNotices.filter(n=>n.id!==element.dataset.notice);if(commitData(next))render();break;}
    case "export-csv":exportDay();break;
    case "export-backup":exportBackup();break;
    case "export-local-backup":exportLocalBackup();break;
    case "connect-shared":connectShared();break;
    case "import-start":$("#import-file").click();break;
    case "reset":resetAll();break;
    case "restore-catalog":restoreCatalog();break;
    case "help":openModal("help");break;
    case "retry-save":if(sharedMode)retryShared();else if(save())toast("Cambios guardados correctamente");break;
    case "reload":window.location.reload();break;
    case "fullscreen":if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast("Usá F11 para pantalla completa.",true));else toast("Usá F11 para pantalla completa.");}else document.exitFullscreen?.().catch(()=>{});break;
  }
}
document.addEventListener("click",event=>{const element=event.target.closest("[data-action]");if(element&&!element.disabled)handleAction(element,event);});
document.addEventListener("focusin",event=>{if(["customer-name","line-note"].includes(event.target.id))inputSession=null;});
document.addEventListener("input",event=>{
  if(event.target.dataset.staffField!==undefined){const field=event.target.dataset.staffField;if(Object.hasOwn(staffDraft,field)&&field!=="method"){staffDraft[field]=event.target.value;staffError="";$("#staff-error")?.classList.add("hidden");const feedback=$("#staff-feedback");if(feedback)feedback.textContent=staffFeedback();}return;}
  if(event.target.dataset.cashReceived!==undefined){const part=paymentParts[Number(event.target.dataset.cashReceived)];if(part)part.cashReceived=event.target.value;updatePaymentFeedback();return;}
  if(event.target.dataset.brlCharged!==undefined){const part=paymentParts[Number(event.target.dataset.brlCharged)];if(part)part.brlCharged=event.target.value;updatePaymentFeedback();return;}
  if(event.target.dataset.brlReceived!==undefined){const part=paymentParts[Number(event.target.dataset.brlReceived)];if(part)part.brlReceived=event.target.value;updatePaymentFeedback();return;}
  if(event.target.dataset.payerName!==undefined){const index=Number(event.target.dataset.payerName),part=paymentParts[index];if(part){part.name=event.target.value;document.querySelectorAll(`[data-payer-label="${index}"]`).forEach(label=>{label.textContent=payerName(index);});document.querySelectorAll(`[data-action="payment-remove"][data-part="${index}"], [data-action="payment-unit"][data-part="${index}"]`).forEach(button=>{if(button.dataset.action==="payment-remove")button.setAttribute("aria-label",`Quitar a ${payerName(index)}`);else{const line=current()?.lines.find(item=>item.id===button.dataset.line);if(line)button.setAttribute("aria-label",`${Number(button.dataset.delta)<0?"Quitar":"Asignar"} una unidad de ${line.name} a ${payerName(index)}`);}});}return;}
  const input=event.target,original=current();if(!original||!["customer-name","line-note"].includes(input.id))return;
  const oldLine=input.id==="line-note"?findLine(input.dataset.line):null;if(input.id==="line-note"&&!oldLine)return;
  const previous=oldLine?oldLine.note:original.name;if(previous===input.value)return;
  if(!canEdit()){input.value=previous;return;}
  const next=deepCopy(data),order=next.orders[selectedSlot],line=oldLine?order.lines.find(item=>item.id===oldLine.id):null;
  const newSession=!inputSession||inputSession.element!==input;
  const session=newSession?{element:input,before:oldLine?deepCopy(oldLine):null,eventIndex:null}:{...inputSession};
  if(line){
    line.note=input.value;
    // Una sola revisión por edición de texto: se actualiza mientras escribe, sin perder foco.
    if(order.sentAt){const change={kind:"MODIFICADO",before:session.before,after:deepCopy(line),at:now()};if(session.eventIndex==null){session.eventIndex=order.kitchenEvents.length;order.kitchenEvents.push(change);}else order.kitchenEvents[session.eventIndex]=change;if(order.status==="LISTO"){order.status="EN COCINA";order.readyAt=null;order.pendingSinceAt=now();}}
  }else order.name=input.value;
  if(!commitData(next)){input.value=previous;return;}
  if(newSession)pushUndo(original);inputSession=session;
  if(line){const details=[...document.querySelectorAll("[data-line-details]")].find(el=>el.dataset.lineDetails===line.id);if(details)details.innerHTML=lineDetails(line);}
  else{const name=$("#order-customer");if(name)name.textContent=order.name?` · ${order.name}`:"";}
  const undoButton=document.querySelector('[data-action="undo"]');if(undoButton)undoButton.disabled=false;
  const status=$("#order-status");if(status){status.textContent=order.status;status.className="status "+statusClass(order.status);}const hint=$("#order-hint");if(hint)hint.textContent=orderStatusHint(order);
});
document.addEventListener("change",event=>{
  if(event.target.dataset.staffField==="method"){if(staffPaymentMethods.includes(event.target.value)){staffDraft.method=event.target.value;staffDraft.cashReceived="";staffDraft.brlCharged="";staffDraft.brlReceived="";staffError="";render();$("#staff-method")?.focus();}return;}
  if(event.target.id==="staff-date"&&/^\d{4}-\d{2}-\d{2}$/.test(event.target.value)){staffDate=event.target.value;render();return;}
  if(event.target.dataset.paymentMethod!==undefined){selectPaymentMethod(Number(event.target.dataset.paymentMethod),event.target.value);return;}
  if(event.target.dataset.payerName!==undefined)return;
  if(event.target.id==="history-date"&&/^\d{4}-\d{2}-\d{2}$/.test(event.target.value)){historyDate=event.target.value;historyDetail=null;render();}
});
document.addEventListener("submit",event=>{if(event.target.id==="staff-sale-form"){event.preventDefault();registerStaffSale();}});
$("#import-file").addEventListener("change",async event=>{
  const file=event.target.files?.[0];event.target.value="";if(!file)return;
  try{const imported=validateImport(JSON.parse(await file.text()));if(!confirm(`Este respaldo contiene ${Object.keys(imported.orders).length} pedidos activos y ${imported.history.length} ventas.\n\n¿Recuperarlo? Reemplazará los datos actuales${sharedMode?" para todos los dispositivos":""}. El registro de Caja no se reemplaza. Guardá un respaldo actual antes de continuar si los necesitás.`))return;importData(imported);}catch{toast("No se pudo recuperar: el archivo no es un respaldo válido de KEBBA. Los datos actuales siguen intactos.",true);}
});
document.addEventListener("keydown",event=>{
  if(event.isComposing)return;
  if(modal){
    if(event.key==="Escape"){event.preventDefault();closeModal();}
    if(event.key==="Tab"){const items=[...$("#modal-root").querySelectorAll('button:not(:disabled),input,select,textarea,summary,[tabindex="0"]')],first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement?.classList.contains("modal"))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
    if([shortcuts.cambiarMesas,shortcuts.cambiarCocina].includes(event.key))event.preventDefault();return;
  }
  if(event.key===shortcuts.cambiarMesas||event.key===shortcuts.cambiarCocina){event.preventDefault();go(event.key===shortcuts.cambiarMesas?"home":"kitchen");return;}
  if(event.key==="Escape"){event.preventDefault();if(selectedLine){selectedLine=null;render();}else if(view!=="home")go("home");return;}
  const typing=event.target.isContentEditable||["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName);if(typing)return;
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()===shortcuts.deshacer.toLowerCase()&&view==="order"){event.preventDefault();if(!event.repeat)undo();return;}
  if(event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
  if(event.key===shortcuts.ayuda){event.preventDefault();openModal("help");return;}
  const key=event.key.toUpperCase();if(view==="home"){const slot=slots().find(s=>s.key===key);if(slot){event.preventDefault();openSlot(slot.id);}}else if(view==="order"){const product=data.catalog.find(p=>p.shortcut&&p.shortcut.toUpperCase()===key);if(product){event.preventDefault();addProduct(product.id);}}
});
window.addEventListener("storage",event=>{if(!sharedMode&&event.key===CONFIG.almacenamiento&&event.newValue!==savedRaw){storageConflict=true;storageWarning="Otra ventana cambió los pedidos. Guardá una copia si tenés cambios acá y recargá para continuar.";renderStorage();}});
window.addEventListener("beforeunload",event=>{if((sharedMode&&(sharedPending||sharedWriting||storageConflict))||(storageWarning&&!readBlocked)){event.preventDefault();event.returnValue="";}});
// Actualiza solamente relojes: no recrea botones, no mueve el foco y no escribe datos.
setInterval(()=>document.querySelectorAll("[data-elapsed]").forEach(el=>{el.textContent=elapsed(Number(el.dataset.elapsed));}),15000);
if(!sharedMode&&!readBlocked){const upgraded=withLatestCatalog(data);if(upgraded)commitData(upgraded);}
render();
if(sharedMode){void refreshShared();setInterval(()=>void refreshShared(),1800);window.addEventListener("focus",()=>void refreshShared());}
if(typeof navigator!=="undefined"&&"serviceWorker" in navigator&&["https:","http:"].includes(window.location.protocol))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));

</script>
