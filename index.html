const $ = selector => document.querySelector(selector);
const deepCopy = value => JSON.parse(JSON.stringify(value));
const safe = value => String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));

const fmtTime = value => value ? new Date(value).toLocaleTimeString("es-UY",{hour:"2-digit",minute:"2-digit"}) : "—";
const fmtDate = value => new Date(value).toLocaleDateString("es-UY");
const dayKey = value => {const d=new Date(value);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");};
const minutes = value => Math.max(0,Math.floor((now()-value)/60000));
const elapsed = value => `Hace ${minutes(value)} min`;
const lineTotal = line => line.qty*(line.unitPrice+line.mods.reduce((sum,mod)=>sum+mod.price,0));
const orderTotal = order => order.lines.reduce((sum,line)=>sum+lineTotal(line),0);
const countItems = order => order.lines.reduce((sum,line)=>sum+line.qty,0);
const sameLine = (a,b) => a.qty===b.qty && a.name===b.name && a.note===b.note && JSON.stringify(a.mods)===JSON.stringify(b.mods);
const emptyData = () => ({dataVersion:1,nextNumber:1,orders:{},history:[],kitchenNotices:[],catalog:deepCopy(productos),modifierCatalog:deepCopy(modificadores),settings:{nombreLocal:CONFIG.nombreLocal,cantidadMesas:CONFIG.cantidadMesas,cantidadPedidosSinMesa:CONFIG.cantidadPedidosSinMesa}});
const slotLabel = id => /^m\d+$/.test(id) ? `Mesa ${Number(id.slice(1))}` : /^p\d+$/.test(id) ? `Pedido ${String.fromCharCode(65+Number(id.slice(1)))}` : String(id);
function slotsFor(settings){return [...Array(settings.cantidadMesas)].map((_,i)=>({id:`m${i+1}`,label:`Mesa ${i+1}`,key:i<9?String(i+1):""})).concat([...Array(settings.cantidadPedidosSinMesa)].map((_,i)=>({id:`p${i}`,label:`Pedido ${String.fromCharCode(65+i)}`,key:String.fromCharCode(65+i)})));}

// Conserva cada aviso enviado a Cocina, incluso si un alta se elimina más tarde.
function lineChanges(before,after,at=now()){
  const result=[];
  for(const old of before){
    const line=after.find(item=>item.id===old.id);
    if(!line)result.push({kind:"CANCELADO",before:deepCopy(old),after:null,at});
    else if(!sameLine(old,line))result.push({kind:"MODIFICADO",before:deepCopy(old),after:deepCopy(line),at});
  }
  for(const line of after)if(!before.some(item=>item.id===line.id))result.push({kind:"NUEVO",before:null,after:deepCopy(line),at});
  return result;
}
function validateImport(raw){
  const fail=message=>{throw Error(message || "El archivo no es un respaldo compatible de KEBBA.");};
  const object=value=>value && typeof value==="object" && !Array.isArray(value);
  const text=value=>typeof value==="string";
  const integer=value=>Number.isSafeInteger(value) && value>=0;
  const timestamp=value=>Number.isFinite(value) && value>0;
  if(!object(raw)||raw.dataVersion!==1||!integer(raw.nextNumber)||raw.nextNumber<1||!object(raw.orders)||!Array.isArray(raw.history)||!Array.isArray(raw.catalog)||!Array.isArray(raw.modifierCatalog)||!object(raw.settings))fail();
  const {cantidadMesas,cantidadPedidosSinMesa}=raw.settings;
  if(!integer(cantidadMesas)||cantidadMesas<1||cantidadMesas>99||!integer(cantidadPedidosSinMesa)||cantidadPedidosSinMesa<1||cantidadPedidosSinMesa>26)fail("La cantidad de lugares del respaldo es inválida.");
  const unique=items=>new Set(items).size===items.length;
  for(const p of raw.catalog)if(!object(p)||!text(p.id)||!text(p.nombre)||!text(p.categoria)||!integer(p.precio)||(p.shortcut!=null&&!text(p.shortcut)))fail("La carta del respaldo es inválida.");
  if(!unique(raw.catalog.map(p=>p.id)))fail("Hay productos repetidos en la configuración.");
  for(const m of raw.modifierCatalog)if(!object(m)||!text(m.id)||!text(m.nombre)||!text(m.grupo)||!integer(m.precio))fail("Los modificadores del respaldo son inválidos.");
  if(!unique(raw.modifierCatalog.map(m=>m.id)))fail("Hay modificadores repetidos en la configuración.");
  function checkLine(line){
    if(!object(line)||!text(line.id)||!text(line.productId)||!text(line.name)||!integer(line.qty)||line.qty<1||!integer(line.unitPrice)||!Array.isArray(line.mods)||!text(line.note))fail("Una línea del respaldo es inválida.");
    for(const mod of line.mods)if(!object(mod)||!text(mod.id)||!text(mod.name)||!integer(mod.price))fail("Una modificación del respaldo es inválida.");
    if(!unique(line.mods.map(m=>m.id))||!integer(lineTotal(line)))fail("Una línea contiene importes o modificadores repetidos inválidos.");
  }
  function checkLines(lines){if(!Array.isArray(lines))fail();lines.forEach(checkLine);if(!unique(lines.map(line=>line.id)))fail("Una comanda tiene líneas repetidas.");}
  const validSlots=new Set(slotsFor(raw.settings).map(s=>s.id)),numbers=new Set();
  for(const [slot,order] of Object.entries(raw.orders))if(!object(order)||!validSlots.has(slot)||order.slot!==slot||!["ABIERTO","EN COCINA","LISTO"].includes(order.status))fail("Hay pedidos en lugares inválidos.");
  for(const order of [...Object.values(raw.orders),...raw.history]){
    if(!object(order)||!integer(order.number)||order.number<1||numbers.has(order.number)||!text(order.slot)||!/^([mp])\d+$/.test(order.slot)||!text(order.name)||!timestamp(order.openedAt))fail("Hay pedidos inválidos o números repetidos.");
    numbers.add(order.number);checkLines(order.lines);checkLines(order.sentSnapshot);
    if(order.status!=="ABIERTO"&&!timestamp(order.sentAt)&&order.status!=="CERRADO")fail("Falta la hora de envío de un pedido.");
    if(order.status==="LISTO"&&!timestamp(order.readyAt))fail("Falta la hora de preparación de un pedido.");
    // Migración compatible con la primera versión, sin borrar pedidos existentes.
    if(!Array.isArray(order.kitchenEvents))order.kitchenEvents=order.sentAt?lineChanges(order.sentSnapshot,order.lines,order.sentAt):[];
    for(const event of order.kitchenEvents){
      if(!object(event)||!["NUEVO","MODIFICADO","CANCELADO"].includes(event.kind)||!timestamp(event.at))fail("Los avisos de Cocina son inválidos.");
      if(event.before)checkLine(event.before);if(event.after)checkLine(event.after);
      if((event.kind==="NUEVO"&&!event.after)||(event.kind==="CANCELADO"&&!event.before)||(event.kind==="MODIFICADO"&&(!event.before||!event.after)))fail();
    }
    if(order.kitchenAck==null)order.kitchenAck=order.status==="LISTO"?order.kitchenEvents.length:0;
    if(!integer(order.kitchenAck)||order.kitchenAck>order.kitchenEvents.length)fail();
    if(!Array.isArray(order.preparedSnapshot))order.preparedSnapshot=order.status==="LISTO"?deepCopy(order.lines):[];
    checkLines(order.preparedSnapshot);
    order.pendingSinceAt=order.pendingSinceAt||order.sentAt;
    order.total=orderTotal(order);
    if(!integer(order.total))fail("El total del pedido es inválido.");
  }
  for(const order of raw.history)if(order.status!=="CERRADO"||!timestamp(order.closedAt)||!text(order.payment))fail("El historial del respaldo es inválido.");
  if(raw.kitchenNotices==null)raw.kitchenNotices=[];
  if(!Array.isArray(raw.kitchenNotices))fail();
  for(const notice of raw.kitchenNotices){if(!object(notice)||!text(notice.id)||!text(notice.label)||!text(notice.reason)||!timestamp(notice.at)||!integer(notice.number))fail("Hay avisos de Cocina inválidos.");checkLines(notice.lines);}
  const maxNumber=Math.max(0,...numbers,...raw.kitchenNotices.map(n=>n.number));
  raw.nextNumber=Math.max(raw.nextNumber,maxNumber+1);
  return raw;
}

let savedRaw=null,storageWarning="",recoveryRaw=null,readBlocked=false,storageConflict=false;
function loadData(){
  try{savedRaw=localStorage.getItem(CONFIG.almacenamiento);return savedRaw?validateImport(JSON.parse(savedRaw)):emptyData();}
  catch{recoveryRaw=savedRaw;readBlocked=!!savedRaw;storageWarning=readBlocked?"No pudimos leer los datos guardados. Se conservaron sin cambios. Importá un respaldo desde Configuración para recuperarlos.":"El navegador no permite guardar. Exportá un respaldo antes de salir y revisá su configuración.";return emptyData();}
}
let data=loadData(),view="home",selectedSlot=null,selectedLine=null,mobileOrderPane="menu",modal=null,payment=null,historyDetail=null,historyDate=dayKey(now()),toastTimer=null;
let focusBeforeModal=null,inputSession=null,lastActivation={key:"",at:0},lastOpenNumber=null;
const undoStacks=new Map();
const settings=()=>data.settings;
const slots=()=>slotsFor(settings());
const slotInfo=id=>slots().find(slot=>slot.id===id);
const current=()=>selectedSlot?data.orders[selectedSlot]:null;
const findLine=id=>current()?.lines.find(line=>line.id===id);
const stackFor=order=>{if(!undoStacks.has(order.number))undoStacks.set(order.number,[]);return undoStacks.get(order.number);};
function renderStorage(){const el=$("#storage-status");if(!el)return;el.innerHTML=storageWarning?`<div class="storage-alert" role="alert"><strong>${safe(storageWarning)}</strong><div><button data-action="export-backup">Guardar copia ahora</button>${storageConflict?`<button data-action="reload">Recargar</button>`:readBlocked?`<button data-action="view" data-view="settings">Recuperar datos</button>`:`<button data-action="retry-save">Reintentar guardado</button>`}</div></div>`:`<span class="saved-indicator">● Guardado automático en este dispositivo</span>`;}
function persist(next,{replaceBlocked=false}={}){
  if((readBlocked||storageConflict)&&!replaceBlocked){renderStorage();return false;}
  try{
    const existing=localStorage.getItem(CONFIG.almacenamiento);
    if(existing!==savedRaw){storageConflict=true;storageWarning="Otra ventana cambió los pedidos. Guardá una copia de esta pantalla y recargá para seguir con los datos más recientes.";renderStorage();return false;}
    for(const order of Object.values(next.orders))order.total=orderTotal(order);
    const raw=JSON.stringify(next);localStorage.setItem(CONFIG.almacenamiento,raw);savedRaw=raw;storageWarning="";readBlocked=false;recoveryRaw=null;renderStorage();return true;
  }catch{storageWarning="ATENCIÓN: los últimos cambios no se pudieron guardar. Dejá esta pantalla abierta y exportá un respaldo antes de salir.";renderStorage();return false;}
}
function save(){return persist(data);}
function commitData(next,options){if(!persist(next,options)){toast("No se completó la acción porque no se pudo guardar.",true);return false;}data=next;return true;}
function canEdit(){if(readBlocked||storageConflict){toast("Revisá el aviso de guardado antes de continuar.",true);return false;}return true;}
function toast(message,error=false){const el=$("#toast");el.textContent=message;el.className="toast"+(error?" error":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add("hidden"),3800);}
function pushUndo(order){const stack=stackFor(order);stack.push({lines:deepCopy(order.lines),name:order.name});if(stack.length>25)stack.shift();}
function recordKitchenChanges(order,before){
  if(!order.sentAt)return;
  const changes=lineChanges(before,order.lines);
  if(!changes.length)return;
  order.kitchenEvents.push(...changes);
  if(order.status==="LISTO"){order.status="EN COCINA";order.readyAt=null;order.pendingSinceAt=now();}
}
function mutateOrder(fn,{renderNow=true,remember=true}={}){
  const order=current();if(!order||!canEdit())return false;
  const before=deepCopy(order.lines);if(remember)pushUndo(order);fn(order);recordKitchenChanges(order,before);save();if(renderNow)render();return true;
}
function openSlot(id){
  if(!slotInfo(id)||!canEdit())return;
  if(!data.orders[id]){data.orders[id]={number:data.nextNumber++,slot:id,name:"",status:"ABIERTO",openedAt:now(),sentAt:null,readyAt:null,closedAt:null,payment:null,lines:[],sentSnapshot:[],kitchenEvents:[],kitchenAck:0,preparedSnapshot:[],pendingSinceAt:null,movedFrom:null};save();}
  selectedSlot=id;selectedLine=null;mobileOrderPane=current().lines.length?"ticket":"menu";lastOpenNumber=current().number;view="order";modal=null;render();window.scrollTo?.(0,0);
}
function releaseEmptyDraft(){const order=current();if(order&&!order.sentAt&&!order.lines.length&&!order.name.trim()){delete data.orders[selectedSlot];save();}}
function go(target){if(!["home","kitchen","history","settings"].includes(target))return;releaseEmptyDraft();modal=null;selectedSlot=null;selectedLine=null;view=target;if(target==="history")historyDate=dayKey(now());render();window.scrollTo?.(0,0);}
function undo(){
  const order=current();if(!order||!canEdit())return;const previous=stackFor(order).pop();if(!previous)return;
  mutateOrder(item=>{item.lines=previous.lines;item.name=previous.name;},{remember:false});selectedLine=null;render();toast(order.sentAt?"Cambio deshecho. Cocina también recibió la corrección.":"Último cambio deshecho");
}
function addProduct(id){
  const product=data.catalog.find(item=>item.id===id);if(!product||!current())return;
  selectedLine=null;
  if(mutateOrder(order=>order.lines.push({id:uid(),productId:id,name:product.nombre,unitPrice:product.precio,qty:1,mods:[],note:"",permiteCombo:!!product.permiteCombo}))){$(".ticket-list")?.scrollTo?.({top:999999});toast(`${product.nombre} agregado${current().sentAt?" · Cocina avisada":""}`);}
}
function modifyLine(id,fn){if(findLine(id))mutateOrder(order=>fn(order.lines.find(line=>line.id===id)));}
function removeLine(id){if(!findLine(id))return;selectedLine=null;mutateOrder(order=>{order.lines=order.lines.filter(line=>line.id!==id);});toast(current()?.sentAt?"Producto eliminado · Cancelación visible en Cocina":"Producto eliminado · Podés deshacer");}
function changeQty(id,delta){const line=findLine(id);if(!line)return;if(line.qty+delta<=0)removeLine(id);else modifyLine(id,item=>item.qty+=delta);}
function allowsCombo(line){return data.modifierCatalog.some(m=>m.id==="hacer-combo") && (line.permiteCombo ?? !!data.catalog.find(p=>p.id===line.productId)?.permiteCombo);}
function toggleMod(lineId,modId){
  const mod=data.modifierCatalog.find(item=>item.id===modId),line=findLine(lineId);if(!mod||!line||(modId==="hacer-combo"&&!allowsCombo(line)))return;
  modifyLine(lineId,item=>{
    if(item.mods.some(m=>m.id===modId)){item.mods=item.mods.filter(m=>m.id!==modId);return;}
    const conflicts={"picante":["sin-picante"],"picante-suave":["sin-picante","sin-salsa"],"sin-picante":["picante","picante-suave"],"sin-salsa":data.modifierCatalog.filter(m=>m.grupo==="Salsas").map(m=>m.id).concat(["salsa-aparte","extra-salsa"])};
    const remove=new Set(conflicts[modId]||[]);if(mod.grupo==="Salsas"||["salsa-aparte","extra-salsa"].includes(modId))remove.add("sin-salsa");
    item.mods=item.mods.filter(m=>!remove.has(m.id));item.mods.push({id:mod.id,name:mod.nombre,price:mod.precio,description:mod.descripcion||""});
  });
}
function splitLine(id){const line=findLine(id);if(!line||line.qty<2)return;const newId=uid();mutateOrder(order=>{const target=order.lines.find(item=>item.id===id);target.qty--;order.lines.splice(order.lines.indexOf(target)+1,0,{...deepCopy(target),id:newId,qty:1});});selectedLine=newId;render();toast("Unidad separada. Ahora podés cambiar solo esta.");}
function sendKitchen(){
  const order=current();if(!order||!canEdit()||order.sentAt)return;
  if(!order.lines.length){toast("Primero agregá un producto.",true);return;}
  const next=deepCopy(data),item=next.orders[selectedSlot];item.sentAt=now();item.pendingSinceAt=item.sentAt;item.sentSnapshot=deepCopy(item.lines);item.status="EN COCINA";
  if(!commitData(next))return;render();beep();toast(`${numberLabel(item.number)} enviado a Cocina`);

function beep(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=700;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.06,ctx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.13);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.14);osc.onended=()=>ctx.close();}catch{}}
function markReady(id){
  const order=data.orders[id];if(!order||order.status!=="EN COCINA"||!canEdit())return;
  const next=deepCopy(data),item=next.orders[id];item.status="LISTO";item.readyAt=now();item.kitchenAck=item.kitchenEvents.length;item.preparedSnapshot=deepCopy(item.lines);
  if(!commitData(next))return;render();toast(`${numberLabel(item.number)} · ${slotLabel(id)} LISTO`);
}
function kitchenNotice(target,order,reason){
  const known=new Map();for(const line of order.sentSnapshot)known.set(line.id,line);
  for(const event of order.kitchenEvents){if(event.before)known.set(event.before.id,event.before);if(event.after)known.set(event.after.id,event.after);}
  for(const line of order.lines)known.set(line.id,line);
  target.kitchenNotices.push({id:uid(),number:order.number,label:slotLabel(order.slot),name:order.name,at:now(),reason,lines:deepCopy([...known.values()])});
}
function deleteOrder(){const order=current();if(!order||!canEdit())return;const warning=order.sentAt?"\n\nYa fue enviado a Cocina. El cocinero verá un aviso de cancelación.":"";if(!confirm(`¿Seguro que querés eliminar el pedido completo de ${slotLabel(selectedSlot)}?${warning}`))return;const next=deepCopy(data);if(order.sentAt)kitchenNotice(next,order,"PEDIDO CANCELADO");delete next.orders[selectedSlot];if(!commitData(next))return;undoStacks.delete(order.number);selectedSlot=null;go("home");toast("Pedido eliminado. El número no se reutiliza.");}
function openModal(type){focusBeforeModal=document.activeElement;modal=type;renderModal();}
function closeModal(){modal=null;payment=null;renderModal();focusBeforeModal?.focus?.();}
function startClose(){if(!current()?.lines.length){toast("Un pedido vacío no se puede cobrar.",true);return;}payment=null;openModal("payment");}
function confirmClose(){
  const order=current();if(!order||!order.lines.length||!payment||!canEdit())return;
  if(order.status==="EN COCINA"&&!confirm("Este pedido todavía figura EN COCINA. ¿Querés cerrarlo igualmente?"))return;
  if(!order.sentAt&&!confirm("Este pedido no fue enviado a Cocina. ¿Ya fue entregado y querés registrar el cobro?"))return;
  const next=deepCopy(data);if(order.status==="EN COCINA")kitchenNotice(next,order,"CERRADO ANTES DE LISTO");
  next.history.push({...deepCopy(order),label:slotLabel(order.slot),total:orderTotal(order),status:"CERRADO",payment,closedAt:now()});delete next.orders[selectedSlot];
  if(!commitData(next))return;undoStacks.delete(order.number);selectedSlot=null;modal=null;go("home");toast(`${numberLabel(order.number)} cobrado · ${money(orderTotal(order))} · Lugar libre`);
}
function moveOrder(destination){
  const order=current(),target=slotInfo(destination);if(!order||!canEdit())return;
  if(!target||data.orders[destination]){toast("Ese lugar está ocupado. Elegí uno libre.",true);return;}

function kitchenItem(line,tag="",cancelled=false){return `<div class="k-line ${cancelled?"cancelled-line":""}">${tag?`<span class="k-label ${tag==="CANCELADO"?"cancel":tag==="NUEVO"?"new":""}">${tag}</span>`:""}<div class="k-product">${line.qty} × ${safe(line.name)}</div>${line.mods.length||line.note?`<div class="k-mods">${lineDetails(line,false)}</div>`:""}</div>`;}
function kitchenLines(order){
  const events=order.kitchenEvents.slice(order.kitchenAck),latest=new Map();for(const event of events)latest.set((event.after||event.before).id,event);
  let html=order.lines.map(line=>{const event=latest.get(line.id),prepared=order.preparedSnapshot.find(old=>old.id===line.id&&sameLine(old,line));return kitchenItem(line,event?.kind||((prepared&&order.status==="EN COCINA")?"YA PREPARADO":""));}).join("");
  if(!order.lines.length)html='<p class="order-hint">Todos los productos fueron cancelados.</p>';
  // El registro no se borra al editar de nuevo: el cocinero puede seguir cada corrección.
  if(events.length)html+=`<section class="k-changes"><h3>CAMBIOS AVISADOS · ${events.length}</h3><p class="note">Son correcciones de la comanda de arriba, no productos adicionales.</p>${events.map(event=>`<div class="k-change"><span class="k-label ${event.kind==="CANCELADO"?"cancel":event.kind==="NUEVO"?"new":""}">${event.kind}</span> <time>${fmtTime(event.at)}</time>${event.before?`<div class="${event.kind==="CANCELADO"?"cancelled-line":"k-old"}">${event.kind==="MODIFICADO"?"Antes: ":""}${event.before.qty} × ${safe(event.before.name)}${lineDetails(event.before,false)?`<div class="k-mods">${lineDetails(event.before,false)}</div>`:""}</div>`:""}${event.after?`<div>${event.kind==="MODIFICADO"?"Ahora: ":""}${event.after.qty} × ${safe(event.after.name)}${lineDetails(event.after,false)?`<div class="k-mods">${lineDetails(event.after,false)}</div>`:""}</div>`:""}</div>`).join("")}</section>`;
  return html;
}

function csvValue(value){let text=String(value??"");if(/^[=+@\-\t\r]/.test(text))text="'"+text;return `"${text.replace(/"/g,'""')}"`;}
async function download(text,filename,type){
  const blob=new Blob([text],{type});
  if(window.matchMedia?.("(pointer: coarse)")?.matches&&typeof File!=="undefined"&&typeof navigator!=="undefined"&&navigator.canShare&&navigator.share){
    const file=new File([blob],filename,{type});
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return true;}}
    catch(error){if(error?.name==="AbortError")return false;}
  }
  const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);return true;
}
function buildDayCsv(){const headers=["Número de pedido","Fecha","Hora apertura","Hora cocina","Hora listo","Hora cierre","Mesa/Pedido","Nombre","Productos","Total","Forma de pago"],rows=historyForDate().map(o=>[numberLabel(o.number),fmtDate(o.closedAt),fmtTime(o.openedAt),fmtTime(o.sentAt),fmtTime(o.readyAt),fmtTime(o.closedAt),o.label||slotLabel(o.slot),o.name,o.lines.map(line=>`${line.qty} x ${line.name}${line.mods.length?" ["+line.mods.map(m=>m.name+(m.description?" · "+m.description:"")).join("; ")+"]":""}${line.note?" ("+line.note+")":""}`).join(" | "),o.total,o.payment]);return "\ufeff"+[headers,...rows].map(row=>row.map(csvValue).join(",")).join("\r\n");}
async function exportDay(){if(await download(buildDayCsv(),`kebba-dia-${historyDate}.csv`,"text/csv;charset=utf-8"))toast("CSV listo. Guardalo en el dispositivo.");}
async function exportBackup(){if(await download(recoveryRaw||JSON.stringify(data,null,2),`kebba-${recoveryRaw?"datos-a-recuperar":"respaldo"}-${dayKey(now())}-${fmtTime(now()).replace(":","")}.json`,"application/json"))toast("Copia lista. Guardala para poder recuperar los datos.");}
function resetAll(){if(!confirm("Esta acción borrará pedidos activos e historial. ¿Seguro?"))return;if(prompt("Para confirmar, escribí BORRAR en mayúsculas:")!=="BORRAR")return;if(!commitData(emptyData(),{replaceBlocked:true}))return;undoStacks.clear();selectedSlot=null;historyDetail=null;modal=null;go("home");toast("Datos borrados");}
function restoreCatalog(){
  if(!canEdit())return;const next=deepCopy(data),newSettings={nombreLocal:CONFIG.nombreLocal,cantidadMesas:CONFIG.cantidadMesas,cantidadPedidosSinMesa:CONFIG.cantidadPedidosSinMesa};
  const valid=new Set(slotsFor(newSettings).map(s=>s.id));if(Object.keys(next.orders).some(slot=>!valid.has(slot))){toast("Primero mové o cerrá los pedidos en los lugares que vas a quitar.",true);return;}
  if(!confirm("¿Aplicar los productos y precios definidos en este archivo? Los productos ya cargados conservarán sus precios."))return;
  next.catalog=deepCopy(productos);next.modifierCatalog=deepCopy(modificadores);next.settings=newSettings;if(commitData(next)){render();toast("Carta actualizada");}
}
function importData(imported){if(!commitData(imported,{replaceBlocked:true}))return false;undoStacks.clear();selectedSlot=null;selectedLine=null;historyDetail=null;modal=null;go("home");toast("Respaldo recuperado correctamente");return true;}
function handleAction(element,event){
  const action=element.dataset.action;
  // La identidad se conserva aunque un render sustituya el botón entre dos clics.
  const key=JSON.stringify(element.dataset),time=now();
  if(event.detail>1||((action==="add-product"||action==="send"||action==="close-confirm"||action==="move-confirm")&&lastActivation.key===key&&time-lastActivation.at<250))return;
  lastActivation={key,at:time};
  switch(action){
    case "view":go(element.dataset.view);break;
    case "order-pane":if(["menu","ticket"].includes(element.dataset.pane)){mobileOrderPane=element.dataset.pane;render();window.scrollTo?.(0,0);}break;
    case "open":openSlot(element.dataset.slot);break;
    case "add-product":addProduct(element.dataset.product);break;
    case "qty":changeQty(element.dataset.line,Number(element.dataset.delta));break;
    case "edit-line":selectedLine=selectedLine===element.dataset.line?null:element.dataset.line;render();if(selectedLine)$(".edit-box")?.scrollIntoView?.({block:"nearest"});break;
    case "done-edit":selectedLine=null;render();break;
    case "remove-line":removeLine(element.dataset.line);break;
    case "split-line":splitLine(element.dataset.line);break;
    case "toggle-mod":toggleMod(element.dataset.line,element.dataset.mod);break;
    case "send":sendKitchen();break;
    case "ready":markReady(element.dataset.slot);break;
    case "undo":undo();break;
    case "delete-order":deleteOrder();break;
    case "close-start":startClose();break;
    case "close-confirm":confirmClose();break;
    case "payment":payment=element.dataset.payment;renderModal();break;
    case "move-start":openModal("move");break;
    case "move-confirm":moveOrder(element.dataset.destination);break;
    case "modal-close":closeModal();break;
    case "history-detail":historyDetail=Number(element.dataset.number);render();$(".history-detail")?.focus();$(".history-detail")?.scrollIntoView?.({block:"nearest"});break;
    case "hide-history":historyDetail=null;render();break;
    case "history-today":historyDate=dayKey(now());historyDetail=null;render();break;
    case "ack-notice":{const next=deepCopy(data);next.kitchenNotices=next.kitchenNotices.filter(n=>n.id!==element.dataset.notice);if(commitData(next))render();break;}
    case "export-csv":exportDay();break;
    case "export-backup":exportBackup();break;
    case "import-start":$("#import-file").click();break;
    case "reset":resetAll();break;
    case "restore-catalog":restoreCatalog();break;
    case "help":openModal("help");break;
    case "retry-save":if(save())toast("Cambios guardados correctamente");break;
    case "reload":window.location.reload();break;
    case "fullscreen":if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast("Usá F11 para pantalla completa.",true));else toast("Usá F11 para pantalla completa.");}else document.exitFullscreen?.().catch(()=>{});break;
  }
}
document.addEventListener("click",event=>{const element=event.target.closest("[data-action]");if(element&&!element.disabled)handleAction(element,event);});
document.addEventListener("focusin",event=>{if(["customer-name","line-note"].includes(event.target.id))inputSession=null;});
document.addEventListener("input",event=>{
  const input=event.target,order=current();if(!order||!["customer-name","line-note"].includes(input.id)||!canEdit())return;
  const line=input.id==="line-note"?findLine(input.dataset.line):null;if(input.id==="line-note"&&!line)return;
  const previous=line?line.note:order.name;if(previous===input.value)return;
  if(!inputSession||inputSession.element!==input){pushUndo(order);inputSession={element:input,before:line?deepCopy(line):null,eventIndex:null};}
  if(line){
    line.note=input.value;
    // Una sola revisión por edición de texto: se actualiza mientras escribe, sin perder foco.
    if(order.sentAt){const change={kind:"MODIFICADO",before:inputSession.before,after:deepCopy(line),at:now()};if(inputSession.eventIndex==null){inputSession.eventIndex=order.kitchenEvents.length;order.kitchenEvents.push(change);}else order.kitchenEvents[inputSession.eventIndex]=change;if(order.status==="LISTO"){order.status="EN COCINA";order.readyAt=null;order.pendingSinceAt=now();}}
    const details=[...document.querySelectorAll("[data-line-details]")].find(el=>el.dataset.lineDetails===line.id);if(details)details.innerHTML=lineDetails(line);
  }else{order.name=input.value;const name=$("#order-customer");if(name)name.textContent=order.name?` · ${order.name}`:"";}
  save();const undoButton=document.querySelector('[data-action="undo"]');if(undoButton)undoButton.disabled=false;
  const status=$("#order-status");if(status){status.textContent=order.status;status.className="status "+statusClass(order.status);}const hint=$("#order-hint");if(hint)hint.textContent=orderStatusHint(order);
});
document.addEventListener("change",event=>{if(event.target.id==="history-date"&&/^\d{4}-\d{2}-\d{2}$/.test(event.target.value)){historyDate=event.target.value;historyDetail=null;render();}});
$("#import-file").addEventListener("change",async event=>{
  const file=event.target.files?.[0];event.target.value="";if(!file)return;
  try{const imported=validateImport(JSON.parse(await file.text()));if(!confirm(`Este respaldo contiene ${Object.keys(imported.orders).length} pedidos activos y ${imported.history.length} ventas.\n\n¿Recuperarlo? Reemplazará los datos actuales. Guardá un respaldo actual antes de continuar si los necesitás.`))return;importData(imported);}catch{toast("No se pudo recuperar: el archivo no es un respaldo válido de KEBBA. Los datos actuales siguen intactos.",true);}
});
document.addEventListener("keydown",event=>{
  if(event.isComposing)return;
  if(modal){
    if(event.key==="Escape"){event.preventDefault();closeModal();}
    if(event.key==="Tab"){const items=[...$("#modal-root").querySelectorAll('button:not(:disabled),input,select,textarea,summary,[tabindex="0"]')],first=items[0],last=items.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement?.classList.contains("modal"))){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
    if([shortcuts.cambiarMesas,shortcuts.cambiarCocina].includes(event.key))event.preventDefault();return;
  }
  if(event.key===shortcuts.cambiarMesas||event.key===shortcuts.cambiarCocina){event.preventDefault();go(event.key===shortcuts.cambiarMesas?"home":"kitchen");return;}
  if(event.key==="Escape"){event.preventDefault();if(selectedLine){selectedLine=null;render();}else if(view!=="home")go("home");return;}
  const typing=event.target.isContentEditable||["INPUT","TEXTAREA","SELECT"].includes(event.target.tagName);if(typing)return;
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()===shortcuts.deshacer.toLowerCase()&&view==="order"){event.preventDefault();if(!event.repeat)undo();return;}
  if(event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
  if(event.key===shortcuts.ayuda){event.preventDefault();openModal("help");return;}
  const key=event.key.toUpperCase();if(view==="home"){const slot=slots().find(s=>s.key===key);if(slot){event.preventDefault();openSlot(slot.id);}}else if(view==="order"){const product=data.catalog.find(p=>p.shortcut&&p.shortcut.toUpperCase()===key);if(product){event.preventDefault();addProduct(product.id);}}
});
window.addEventListener("storage",event=>{if(event.key===CONFIG.almacenamiento&&event.newValue!==savedRaw){storageConflict=true;storageWarning="Otra ventana cambió los pedidos. Guardá una copia si tenés cambios acá y recargá para continuar.";renderStorage();}});
window.addEventListener("beforeunload",event=>{if(storageWarning&&!readBlocked){event.preventDefault();event.returnValue="";}});
window.addEventListener("resize",fitTicket);
window.addEventListener("scroll",fitTicket,{passive:true});
// Actualiza solamente relojes: no recrea botones, no mueve el foco y no escribe datos.
setInterval(()=>document.querySelectorAll("[data-elapsed]").forEach(el=>{el.textContent=elapsed(Number(el.dataset.elapsed));}),15000);
render();
if(typeof navigator!=="undefined"&&"serviceWorker" in navigator&&["https:","http:"].includes(window.location.protocol))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));

</script>
